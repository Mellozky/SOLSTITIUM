name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Back-end (compilar y probar)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: solstitium
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/solstitium
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # mvnw se subió desde Windows sin permiso de ejecución
      - name: Dar permiso de ejecución a mvnw
        run: chmod +x mvnw

      - name: Compilar y correr las pruebas
        run: ./mvnw -B verify

  frontend:
    name: Front-end (instalar y compilar)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      # Mientras no exista frontend/ (lo crea Carlos), el job pasa sin hacer nada
      - name: Revisar si existe el front-end
        id: front
        working-directory: .
        run: |
          if [ -f frontend/package-lock.json ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Aún no hay frontend/package-lock.json; se omite el build del front-end."
          fi

      - name: Instalar Node.js 24
        if: steps.front.outputs.existe == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        if: steps.front.outputs.existe == 'true'
        run: npm ci

      - name: Compilar
        if: steps.front.outputs.existe == 'true'
        run: npm run build
