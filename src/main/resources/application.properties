spring.application.name=SOLSTITIUM

# Base de datos PostgreSQL (parametros de referencia). En despliegue se definen por variables de entorno.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/solstitium}
spring.datasource.username=${DB_USERNAME:postgres}
# Sin valor por defecto: si falta DB_PASSWORD, la aplicación no arranca en lugar de probar una clave genérica.
spring.datasource.password=${DB_PASSWORD}

# El esquema lo gestiona Flyway (src/main/resources/db/migration); Hibernate solo lo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# No convertir silenciosamente estratos o identificadores decimales en enteros.
spring.jackson.deserialization.accept-float-as-int=false

# Puerto: Render lo indica en PORT; en local se usa 8080.
server.port=${PORT:8080}

# Render atiende HTTPS y reenvía la petición; con esto Spring reconoce el esquema y el host originales.
server.forward-headers-strategy=framework

# En despliegue, la interfaz se empaqueta en el mismo JAR (perfil Maven "interfaz") y comparte origen
# con la API. Este origen solo se usa si la interfaz se sirve desde otra dirección.
app.frontend.origin=${APP_FRONTEND_ORIGIN:http://localhost:5173}

# Con interfaz y API en el mismo origen, la cookie de sesión es propia: SameSite=Lax.
# En despliegue con HTTPS, configurar SESSION_COOKIE_SECURE=true.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
