spring.application.name=SOLSTITIUM

# Base de datos PostgreSQL (parametros de referencia). En despliegue se definen por variables de entorno.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/solstitium}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# El esquema lo gestiona Flyway (src/main/resources/db/migration); Hibernate solo lo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
