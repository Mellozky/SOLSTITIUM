spring.application.name=SOLSTITIUM

# Base de datos PostgreSQL (parametros de referencia). En despliegue se definen por variables de entorno.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/solstitium}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# El esquema lo gestiona Flyway (src/main/resources/db/migration); Hibernate solo lo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# No convertir silenciosamente estratos o identificadores decimales en enteros.
spring.jackson.deserialization.accept-float-as-int=false

# La SPA local corre en Vite; en despliegue se establece la URL pública del front-end.
app.frontend.origin=${APP_FRONTEND_ORIGIN:http://localhost:5173}

# En Render, configurar SESSION_COOKIE_SAME_SITE=none y SESSION_COOKIE_SECURE=true
# para permitir sesiones desde el dominio de Vercel.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
